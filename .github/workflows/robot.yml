name: Robot del mattino

on:
  schedule:                 # tre tentativi: se GitHub ne salta uno, parte al successivo
    - cron: '17 5 * * *'    # 6:17 in Italia (d'inverno)
    - cron: '47 5 * * *'    # 6:47
    - cron: '17 6 * * *'    # 7:17
  workflow_dispatch:        # per farlo partire a mano dal pulsante "Run workflow"
  push:                     # parte anche quando si cambia il robot o gli argomenti seguiti
    branches: [main]
    paths: ['.github/workflows/robot.yml', 'scripts/robot.mjs', 'data/seguiti.json']

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Il giro di oggi è già fatto?
        id: controllo
        run: |
          OGGI=$(TZ=Europe/Rome date +%Y-%m-%d)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f "data/robot/storico/$OGGI.json" ]; then
            echo "Il giro di oggi ($OGGI) è già fatto: mi fermo."; echo "salta=si" >> "$GITHUB_OUTPUT"
          else echo "salta=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.controllo.outputs.salta == 'no'
        with:
          node-version: '22'
      - name: Cerca e analizza
        if: steps.controllo.outputs.salta == 'no'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TETTO_CREDITI: '9500'
        run: node scripts/robot.mjs
      - name: Salva i risultati
        if: always() && steps.controllo.outputs.salta == 'no'
        run: |
          git config user.name "robot-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/robot
          if git diff --cached --quiet; then echo "Niente da salvare"; exit 0; fi
          git commit -m "Robot: ricerche del $(TZ=Europe/Rome date +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push
